name: Deploy to Railway

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          set +e
          output=$(railway up --ci \
            --project 0dc54340-8fff-49fe-9c1a-dc75f4b817e3 \
            --service c9946ac4-1fc2-49a9-b33d-aae64a846b0e \
            --environment 3313c6ec-59c9-4833-bb5d-0fbb5843af0a 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done <<< "$(printf '%s\n' "$output" | tail -n 10)"
            exit $status
          fi
